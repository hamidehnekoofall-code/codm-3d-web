<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CODM Web 3D - Mythic Edition</title>
<style>
  body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  canvas { display: block; }
  
  /* UI */
  #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  
  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 30px; height: 30px;
    transform: translate(-50%, -50%);
    border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%;
  }
  #crosshair::before { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: red; border-radius: 50%; transform: translate(-50%, -50%); }
  
  #stats {
    position: absolute; top: 20px; left: 20px; color: #00ffff; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #00ffff;
  }
  #stats span { color: gold; font-size: 24px; text-shadow: 0 0 10px gold; }

  /* Joystick */
  #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; }
  #joystick-knob { position: absolute; top: 30px; left: 30px; width: 60px; height: 60px; background: rgba(0, 255, 255, 0.5); border-radius: 50%; box-shadow: 0 0 15px cyan; }

  /* Shoot Button */
  #shoot-btn {
    position: absolute; bottom: 40px; right: 40px; width: 90px; height: 90px;
    background: radial-gradient(circle, rgba(255,0,0,0.8) 0%, rgba(150,0,0,0.5) 100%);
    border: 2px solid #ff4444; border-radius: 50%; pointer-events: auto;
    display: flex; justify-content: center; align-items: center; color: white; font-size: 30px;
    box-shadow: 0 0 20px red;
  }
  #shoot-btn:active { transform: scale(0.9); }

</style>
</head>
<body>

<div id="ui-layer">
  <div id="stats">Mythic AK117 | CP: <span>9,999,999</span></div>
  <div id="crosshair"></div>
  
  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>
  
  <div id="shoot-btn">🔥</div>
</div>

<!-- استفاده از Three.js و افکت‌های پس‌پردازش (Bloom) برای گرافیک خفن -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
// --- تنظیمات پایه ---
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x111122, 0.02); // مه برای عمق بخشیدن به محیط

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 5); // قد یک انسان معمولی

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true; // فعالسازی سایه‌ها
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// --- افکت Bloom (درخشش نئونی) ---
const renderScene = new THREE.RenderPass(scene, camera);
const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
bloomPass.threshold = 0.2;
bloomPass.strength = 1.2;
bloomPass.radius = 0.5;

const composer = new THREE.EffectComposer(renderer);
composer.addPass(renderScene);
composer.addPass(bloomPass);

// --- نورپردازی ---
const ambientLight = new THREE.AmbientLight(0x404060, 0.8);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(20, 50, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 100;
dirLight.shadow.camera.left = -50;
dirLight.shadow.camera.right = 50;
dirLight.shadow.camera.top = 50;
dirLight.shadow.camera.bottom = -50;
scene.add(dirLight);

// نور نئونی نقطه‌ای برای افکت متیک
const neonLight = new THREE.PointLight(0xcc00ff, 2, 10);
neonLight.position.set(0, 1, -1);
camera.add(neonLight);
scene.add(camera);

// --- ساخت محیط (زمین و دیوارها) ---
const floorGeo = new THREE.PlaneGeometry(200, 200);
const floorMat = new THREE.MeshStandardMaterial({ 
    color: 0x222222, 
    roughness: 0.2, 
    metalness: 0.8 
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ساخت کانتینرها (شبیه نقشه Shipment)
const boxGeo = new THREE.BoxGeometry(4, 4, 8);
const boxMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7, roughness: 0.3 });
const neonBoxMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x00ffff, emissiveIntensity: 1 }); // درخشش آبی

for(let i=0; i<30; i++) {
    const isNeon = Math.random() > 0.7;
    const box = new THREE.Mesh(boxGeo, isNeon ? neonBoxMat : boxMat);
    box.position.set((Math.random() - 0.5) * 80, 2, (Math.random() - 0.5) * 80);
    box.rotation.y = Math.random() * Math.PI;
    box.castShadow = true;
    box.receiveShadow = true;
    scene.add(box);
}

// --- ساخت اسلحه (Mythic Weapon) ---
const gunGroup = new THREE.Group();
const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
const mythicMat = new THREE.MeshStandardMaterial({ color: 0x220033, emissive: 0xff00ff, emissiveIntensity: 1.5 });

// بدنه اصلی
const body = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.9), gunMat);
body.castShadow = true;
gunGroup.add(body);
// قطعات نئونی
const part1 = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.22, 0.2), mythicMat);
part1.position.z = -0.2; gunGroup.add(part1);
const part2 = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.1), mythicMat);
part2.position.set(0, -0.1, 0.1); gunGroup.add(part2);
// خشاب
const mag = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.2), gunMat);
mag.position.set(0, -0.2, -0.1); gunGroup.add(mag);

gunGroup.position.set(0.2, -0.2, -0.5); // موقعیت در دست راست
camera.add(gunGroup);

// --- کنترل‌ها (Joystick و چرخش دوربین) ---
const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');
let joyActive = false;
let joyVector = { x: 0, y: 0 };

joystickZone.addEventListener('touchstart', (e) => {
    joyActive = true;
    updateJoystick(e.touches[0]);
});
joystickZone.addEventListener('touchmove', (e) => {
    if (joyActive) updateJoystick(e.touches[0]);
});
joystickZone.addEventListener('touchend', () => {
    joyActive = false;
    joyVector = { x: 0, y: 0 };
    joystickKnob.style.transform = `translate(0px, 0px)`;
});

function updateJoystick(touch) {
    const rect = joystickZone.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    let deltaX = touch.clientX - centerX;
    let deltaY = touch.clientY - centerY;
    
    // محدود کردن حرکت دسته
    const maxDist = 40;
    const dist = Math.hypot(deltaX, deltaY);
    if (dist > maxDist) {
        deltaX = (deltaX / dist) * maxDist;
        deltaY = (deltaY / dist) * maxDist;
    }
    joystickKnob.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
    joyVector.x = deltaX / maxDist; 
    joyVector.y = deltaY / maxDist;
}

// چرخش دوربین (کشیدن روی صفحه غیر از دکمه‌ها)
let lookActive = false;
let prevLook = { x: 0, y: 0 };
let rot = { x: 0, y: 0 };

renderer.domElement.addEventListener('touchstart', (e) => {
    lookActive = true;
    prevLook = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
renderer.domElement.addEventListener('touchmove', (e) => {
    if(!lookActive) return;
    let dX = e.touches[0].clientX - prevLook.x;
    let dY = e.touches[0].clientY - prevLook.y;
    rot.y -= dX * 0.005;
    rot.x -= dY * 0.005;
    rot.x = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, rot.x));
    prevLook = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
renderer.domElement.addEventListener('touchend', () => { lookActive = false; });

// شلیک
const shootBtn = document.getElementById('shoot-btn');
let recoil = 0;
shootBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    recoil = 0.1;
    if(navigator.vibrate) navigator.vibrate(40);
});
shootBtn.addEventListener('click', () => { recoil = 0.1; if(navigator.vibrate) navigator.vibrate(40); });

// --- حلقه بازی ---
const clock = new THREE.Clock();
const moveSpeed = 8;

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    // چرخش دوربین
    camera.rotation.order = 'YXZ';
    camera.rotation.y = rot.y;
    camera.rotation.x = rot.x;

    // حرکت با Joystick
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    
    // فقط حرکت افقی
    forward.y = 0; forward.normalize();
    right.y = 0; right.normalize();

    let moveX = (joyVector.x * right.x) - (joyVector.y * forward.x);
    let moveZ = (joyVector.x * right.z) - (joyVector.y * forward.z);

    camera.position.x += moveX * moveSpeed * dt;
    camera.position.z += moveZ * moveSpeed * dt;

    // انیمیشن اسلحه (Recoil)
    if (recoil > 0) {
        gunGroup.position.z = -0.5 + recoil;
        recoil -= dt * 2;
        if (recoil < 0) recoil = 0;
    } else {
        // نفس کشیدن آرام اسلحه
        gunGroup.position.z = -0.5 + Math.sin(clock.elapsedTime * 2) * 0.01;
        gunGroup.position.y = -0.2 + Math.cos(clock.elapsedTime * 2) * 0.01;
    }

    // رندر با افکت Bloom
    composer.render();
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
